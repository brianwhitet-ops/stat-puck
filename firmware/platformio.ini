; Seeed XIAO nRF52840 + Waveshare 2.9" B/W (SSD1680 / GxEPD2_290_T94_V2)
; Official nordicnrf52@11 has no XIAO board. maxgerhardt fork provides
; `xiaoble` (mbed) and `xiaoble_adafruit` (Adafruit nRF52 + LittleFS).
; Env name stays `xiaoble` so `pio run -e xiaoble -d firmware` is unchanged.
[env:xiaoble]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
lib_archive = no
lib_deps =
  zinggjm/GxEPD2@^1.5.8
build_flags =
  -Iinclude
  -DSLAB_HOST=0
build_src_filter =
  +<*>
  -<slab_frames.c>
