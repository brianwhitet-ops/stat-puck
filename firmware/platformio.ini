; Seeed XIAO nRF52840 + Waveshare 2.9" B/W (SSD1680 / GxEPD2_290_T94_V2)
; Official nordicnrf52@11 has no XIAO board. maxgerhardt fork provides
; `xiaoble` (mbed) and `xiaoble_adafruit` (Adafruit nRF52 + LittleFS).
; Env name stays `xiaoble` so `pio run -e xiaoble -d firmware` is unchanged.
;
; Platform, framework, and GCC are pinned to the packages recorded in
; docs/SOFTWARE-HANDOFF-2026-09-18.md (10.1.0+sha.cac6fcf,
; 1.10101.0+sha.3ae21c3, GCC ARM 7.2.1). GxEPD2 is pinned to the 1.6.9
; that build resolved, instead of the floating ^1.5.8 range.
; Scoring startup is still mount-only. The factory erase image is
; env:xiaoble_provision (firmware/tools/provision/).

[xiaoble_common]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
platform_packages =
    framework-arduinoadafruitnrf52-seeed@https://github.com/maxgerhardt/framework-arduinoadafruitnrf52-seeed.git#3ae21c3c6c544fed6e949f00986324dd95fb2b89
    toolchain-gccarmnoneeabi@1.70201.0

[env:xiaoble]
extends = xiaoble_common
lib_archive = no
lib_deps =
    zinggjm/GxEPD2@1.6.9
build_flags =
    -Iinclude
    -DSLAB_HOST=0
build_src_filter =
    +<*>
    -<slab_frames.c>

; Destructive factory/service image. Own source directory. Do not upload
; this env when the scoring firmware is the intended image.
[env:xiaoble_provision]
extends = xiaoble_common
src_dir = tools/provision
lib_archive = no
build_flags =
    -DSLAB_FACTORY_PROVISION=1
