; Seeed XIAO nRF52840 + Waveshare 2.9" B/W (SSD1680 / GxEPD2_290_T94_V2)
[env:xiaoble]
platform = nordicnrf52
board = xiaoble
framework = arduino
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2@^1.5.8
build_flags =
  -Iinclude
  -DSLAB_HOST=0
build_src_filter =
  +<src/*>
  +<src/main.cpp>
  -<host/>
  -<tests/>
  -<tools/>
